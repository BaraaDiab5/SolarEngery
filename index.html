<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - جامعة حلب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login">
        <div class="head">
            <div><img src="./icon/images-removebg-preview.png" alt="logo-aleppo" width="80%" height="80%"></div>
            <p>جامعة حلب </p>
            <p>كلية الهندسة المعلوماتية</p>
        </div>
        
        <form class="content">
            <div class="formcontent">
                <span class="icon">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" id="userName" placeholder="اسم المستخدم " required/>
            </div>
            <div class="formcontent">
                <span class="icon">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="password"  placeholder="كلمة السر" required/>
            </div>
            <button class="buttonLogIn">تسجيل الدخول</button>
        </form>

        <div class="foot">
            <p>جميع الحقوق محفوظة لصالح جامعة حلب</p>
            <div></div>
        </div>
    </div>

</body>
<!-- javaScript -->
<script src="main.js"></script>
</html>
