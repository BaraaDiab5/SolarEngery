<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <div class="dashboard">
        <div class="head"></div>
        <div class="content">
            <div class="welcome">
                <p>أهلاً بك</p>
                <p class="name"></p>
                <p>يمكنك الاطلاع على محتوى التطبيق</p>
            </div>
            <div class="con-bar">
                <p></p>
                <p>الإستهلاك الحالي</p>
                <p>26KW</p>
            </div>
            <div class="cardsDash">
                <!-- card 1 -->
                <div class="card" id="panels">
                    <div>
                        <i class="fa-solid fa-solar-panel large-icon orange-glow"></i>
                    </div>
                    <p>حالة استهلاك الألواح</p>
                </div>

                <!-- card 2 -->
                <div class="card" id="rooms">
                    <div>
                        <span class="room-text">Room</span>
                    </div>
                    <p>الغرف الشاغرة حالياً</p>
                </div>

                <!-- card 3 -->
                <div class="card" id="scheduls">
                    <div>
                        <i class="fa-solid fa-calendar-week large-icon"></i>
                    </div>
                    <p>تعديل جدول التشغيل </p>
                </div>

                <!-- card 4 -->
                <div class="card" id="controlRoom">
                    <div>
                        <i class="fa-regular fa-lightbulb icon-dimmed"></i>
                        <i class="fa-solid fa-lightbulb icon-glowing"></i>
                    </div>
                    <p>تشغيل غرفة معينة</p>
                </div>
            </div>
        </div>
        <div class="foot">
            <p>جميع الحقوق محفوظة لصالح جامعة حلب</p>
            <div></div>
        </div>
    </div>
</body>
<!-- javaScript -->
 <script src="/main.js"></script>
</html>
