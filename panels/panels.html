<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الإستهلاك الألواح</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <div class="panels">
        <div class="head">
            <div class="back">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <p>حالة الإستهلاك للألواح</p>
        </div>
        <div class="content">
            <div class="part1">
                <div class="cycle">
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle orange"></span>
                    <span class="child-cycle orange"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                </div>
                <div class="content-part1">
                    <p class="number">0KW</p>
                    <div>
                        <p>26KW</p>
                        <p>الاستطاعة الواردة من الألواح</p>
                    </div>
                    <P class="number">295KW</P>
                </div>
            </div>

            <div class="con-bar">
                <div><span class="cycle-con-bar"></span></div>
                <div>
                    <p class="active text-labels">الإستطاعة</p>
                    <p class="text-labels">الفولت</p>
                    <p class="text-labels">الأمبير</p>
                </div>
            </div>
            <div class="part2">
                <div class="cycle">
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle "></span>
                    <span class="child-cycle"></span>
                    <span class="child-cycle orange"></span>
                    <span class="child-cycle orange"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                    <span class="child-cycle white"></span>
                </div>
                <div class="content-part2">
                    <p class="number">0%</p>
                    <div>
                        <p>75%</p>
                        <p>حالة البطاريات</p>
                    </div>
                    <P class="number">100%</P>
                </div>
            </div>
            <div class="controls-section">
                <div>
                    <p>استخدام البطاريات</p>
                    <label class="switch">
                        <input type="checkbox"/>
                        <div></div>
                    </label>
                </div>
                <div>
                    <p>استخدام الشبكة الكهربائية</p>
                    <label class="switch">
                        <input type="checkbox"/>
                        <div></div>
                    </label>
                </div>
            </div>
        </div>
        <div class="foot">
            <div></div>
        </div>
    </div>
</body>
<!-- javaScript -->
 <script src="panels.js"></script>
</html>
