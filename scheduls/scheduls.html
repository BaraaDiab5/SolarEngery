<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل جدول التشغيل</title>
    <link rel="stylesheet" href="scheduls.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <div class="scheduls">
        <div class="head">
            <p>تعديل جدول التشغيل</p>
            <div class="back">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
        </div>
        <div class="content">
            <div class="con-head">
                <p>يوم</p>
                <select name="days" class="listDays">
                    <option value="sunday">الأحد</option>
                    <option value="monday">الاثنين</option>
                    <option value="tuesday">الثلاثاء</option>
                    <option value="wednesday">الأربعاء</option>
                    <option value="thursday">الخميس</option>
                    <option value="saturday">السبت</option>
                </select>
            </div>

            <div class="table">
                <div class="table-head">
                    <div class="column name-head">
                        <div class="column-title">القاعة</div>
                    </div>
                    <div class="column">
                        <div class="column-title">المحاضرة الأولى</div>
                    </div>
                    <div class="column">
                        <div class="column-title">المحاضرة الثانية</div>
                    </div>
                    <div class="column">
                        <div class="column-title">المحاضرة الثالثة</div>
                    </div>
                    <div class="column">
                        <div class="column-title">المحاضرة الرابعة</div>
                    </div>
                    <div class="column">
                        <div class="column-title">المحاضرة الخامسة</div>
                    </div>
                </div>
            </div>

            <div class="submit">
                <p class="btnsave">حفظ</p>
                <p class="btnback">تراجع</p>
                <div class="message">تم بنجاح</div>
            </div>
            
        </div>
        <div class="foot">
            <div></div>
        </div>
    </div>
    
</body>

<!-- javaScript -->
 <script src="scheduls.js"></script>
</html>
